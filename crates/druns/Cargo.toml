[package]
name = "druns"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1.0", features = ["full"] }
 tokio-stream = { version = "0.1", features = ["io-util"] }
futures = "0.3"
 chrono = "0.4"
 rand = "0.8"
sysinfo = "0.30"
portable-pty = "0.8"
durable-color-resolver = { git = "https://github.com/durableprogramming/durable-color-resolver" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
figlet-rs = "0.1"
shell-words = "1.1"
 pcap = { version = "0.10", optional = true }
 etherparse = { version = "0.13", optional = true }
 procfs = "0.15"
 netstat2 = { version = "0.11", optional = true }
 durable-run-analytics = { path = "../durable-run-analytics" }
 durable-run-config-batch = { path = "../durable-run-config-batch" }
 durable-run-parallel = { path = "../durable-run-parallel" }
 durable-run-template = { path = "../durable-run-template" }
 durable-run-workflow = { path = "../durable-run-workflow" }
 durable-run-tui-multi = { path = "../durable-run-tui-multi" }

[features]
default = []
experimental-pcap = ["pcap", "etherparse", "netstat2"]

[dev-dependencies]
tempfile = "3.0"