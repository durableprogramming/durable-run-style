[package]
name = "durable-run-config-batch"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["time"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.0"

[lib]
path = "lib.rs"
