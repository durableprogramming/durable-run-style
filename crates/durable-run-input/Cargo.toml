[package]
name = "durable-run-input"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["io-std", "fs", "io-util", "macros", "rt-multi-thread"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
regex = "1.0"

[dev-dependencies]
tempfile = "3.0"

[lib]
path = "lib.rs"
