[package]
name = "durable-run-integrations"
version = "0.1.0"
edition = "2018"

[dependencies]
tokio = { version = "1.0", features = ["process", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[lib]
path = "lib.rs"
