[package]
name = "durable-run-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["time", "sync"] }
tokio-util = "0.7"
sysinfo = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
durable-run-analytics = { path = "../durable-run-analytics" }
durable-run-config-batch = { path = "../durable-run-config-batch" }

[dev-dependencies]
tempfile = "3.0"

[lib]
path = "lib.rs"
