[package]
name = "durable-run-perf"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.29"
durable-run-analytics = { path = "../durable-run-analytics" }

[lib]
path = "lib.rs"
