[package]
name = "durable-run-testing"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
assert_cmd = "2.0"
predicates = "3.0"
durable-run-parallel = { path = "../durable-run-parallel" }
durable-run-analytics = { path = "../durable-run-analytics" }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
path = "lib.rs"
