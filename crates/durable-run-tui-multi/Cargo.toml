[package]
name = "durable-run-tui-multi"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
 serde = { version = "1.0", features = ["derive"] }
 durable-run-parallel = { path = "../durable-run-parallel" }
durable-run-analytics = { path = "../durable-run-analytics" }
durable-run-config-batch = { path = "../durable-run-config-batch" }
durable-run-template = { path = "../durable-run-template" }
chrono = "0.4"

[lib]
path = "lib.rs"
