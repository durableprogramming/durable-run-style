[package]
name = "durable-run-workflow"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures = "0.3"
durable-run-parallel = { path = "../durable-run-parallel" }
durable-run-template = { path = "../durable-run-template" }

[lib]
path = "lib.rs"
